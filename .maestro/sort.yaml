# Cycles the sort order, checks pins stay on top and moves lock, and checks the order survives a relaunch.
# Run: maestro --device <simulator UDID> test .maestro/sort.yaml --test-output-dir <your own folder>
appId: com.buidler0.todoios
---
- launchApp:
    clearState: true
# A no-op swipe stops Maestro's iOS driver crashing on a cold start.
- swipe:
    direction: DOWN
    duration: 100
# The filter buttons stay disabled until the saved list has loaded.
- extendedWaitUntil:
    visible:
      text: "All"
      enabled: true
    timeout: 20000
- tapOn: "What needs doing?"
- inputText: "banana"
- tapOn: "Add"
- tapOn: "What needs doing?"
- inputText: "Apple"
- tapOn: "Add"
- tapOn: "What needs doing?"
- inputText: "cherry"
- tapOn: "Add"
- tapOn: "banana"
- assertVisible: "2 items left"
- assertVisible:
    text: "Move Apple up"
    enabled: true
- tapOn: "Sort: Manual"
- assertVisible: "Sort: A-Z"
- assertVisible:
    text: "Apple"
    above: "banana"
- assertVisible:
    text: "banana"
    above: "cherry"
- assertVisible:
    text: "Move Apple down"
    enabled: false
- tapOn: "Sort: A-Z"
- assertVisible: "Sort: Done last"
- assertVisible:
    text: "Apple"
    above: "cherry"
- assertVisible:
    text: "cherry"
    above: "banana"
- tapOn: "Pin banana"
- assertVisible:
    text: "banana"
    above: "Apple"
- assertVisible:
    text: "Move cherry up"
    enabled: false
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      text: "All"
      enabled: true
    timeout: 20000
- assertVisible: "Sort: Done last"
- assertVisible:
    text: "banana"
    above: "Apple"
- assertVisible:
    text: "Apple"
    above: "cherry"
- tapOn: "Sort: Done last"
- assertVisible: "Sort: Manual"
- assertVisible:
    text: "Move cherry up"
    enabled: true
