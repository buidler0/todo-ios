# Cycles the sort order, checks pinned to-dos stay first and move buttons lock, and checks the order survives a relaunch.
# Run: maestro --device <simulator UDID> test .maestro/sort.yaml --test-output-dir <your own folder>
appId: com.buidler0.todoios
---
- launchApp:
    clearState: true
# A no-op swipe stops Maestro's iOS driver crashing on a cold start.
- swipe:
    direction: DOWN
    duration: 100
# The filter buttons stay disabled until the saved list has loaded.
- extendedWaitUntil:
    visible:
      text: "All"
      enabled: true
    timeout: 20000
- tapOn: "What needs doing?"
- inputText: "banana"
- tapOn: "Add"
- inputText: "Cherry"
- tapOn: "Add"
- inputText: "apple"
- tapOn: "Add"
- tapOn: "banana"
- assertVisible: "2 items left"
- assertVisible:
    text: "Move Cherry up"
    enabled: true

# A-Z ignores case.
- tapOn: "Sort: Manual"
- assertVisible:
    text: "banana"
    below: "apple"
- assertVisible:
    text: "Cherry"
    below: "banana"
- assertVisible:
    text: "Move Cherry up"
    enabled: false

# A pinned to-do stays above the rest.
- tapOn: "Pin Cherry"
- assertVisible:
    text: "apple"
    below: "Cherry"

# Done last keeps list order but puts the done to-do last.
- tapOn: "Sort: A-Z"
- assertVisible: "Sort: Done last"
- assertVisible:
    text: "apple"
    below: "Cherry"
- assertVisible:
    text: "banana"
    below: "apple"
- assertVisible:
    text: "Move apple up"
    enabled: false

# The order is saved.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      text: "All"
      enabled: true
    timeout: 20000
- assertVisible: "Sort: Done last"
- assertVisible:
    text: "banana"
    below: "apple"

# Manual brings back the list order and the move buttons.
- tapOn: "Sort: Done last"
- assertVisible: "Sort: Manual"
- assertVisible:
    text: "banana"
    below: "Cherry"
- assertVisible:
    text: "apple"
    below: "banana"
- assertVisible:
    text: "Move apple up"
    enabled: true
