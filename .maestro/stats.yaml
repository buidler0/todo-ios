# Checks the Stats tab: empty message, counts for five to-dos, and a refresh after the list changes.
# Run: maestro --device <simulator UDID> test .maestro/stats.yaml --test-output-dir <your own folder>
appId: com.buidler0.todoios
---
- launchApp:
    clearState: true
# A no-op swipe stops Maestro's iOS driver crashing on a cold start.
- swipe:
    direction: DOWN
    duration: 100
# The filter buttons stay disabled until the saved list has loaded.
- extendedWaitUntil:
    visible:
      text: "All"
      enabled: true
    timeout: 20000
- tapOn: "Stats, tab.*"
- assertVisible: "No to-dos yet"
- tapOn: "To-dos, tab.*"
- extendedWaitUntil:
    visible: "Nothing to do yet."
    timeout: 10000
- tapOn: "What needs doing?"
- inputText: "Alpha"
- tapOn: "Add"
- inputText: "Bravo"
- tapOn: "Add"
- inputText: "Charlie"
- tapOn: "Add"
- inputText: "Delta"
- tapOn: "Add"
- inputText: "Echo"
- tapOn: "Add"
- assertVisible: "5 items left"
- tapOn: "Alpha"
- tapOn: "Bravo"
- assertVisible: "3 items left"
- pressKey: Enter
- tapOn: "Stats, tab.*"
- assertVisible: "5 to-dos"
- assertVisible: "2 done"
- assertVisible: "3 left"
- assertVisible: "40% done"
- tapOn: "To-dos, tab.*"
- tapOn: "Charlie"
- assertVisible: "2 items left"
- pressKey: Enter
- tapOn: "Stats, tab.*"
- assertVisible: "5 to-dos"
- assertVisible: "3 done"
- assertVisible: "2 left"
- assertVisible: "60% done"
