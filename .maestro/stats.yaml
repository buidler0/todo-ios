appId: com.buidler0.todoios
---
- launchApp:
    clearState: true
# A no-op swipe stops Maestro's iOS driver crashing on a cold start.
- swipe:
    direction: DOWN
    duration: 100
- extendedWaitUntil:
    visible:
      text: "All"
      enabled: true
    timeout: 20000
- tapOn: "Stats, tab.*"
- assertVisible: "No to-dos yet"
- tapOn: "To-dos, tab.*"
- tapOn: "What needs doing?"
- inputText: "Buy milk"
- tapOn: "Add"
- tapOn: "What needs doing?"
- inputText: "Walk dog"
- tapOn: "Add"
- hideKeyboard
- tapOn: "Buy milk"
- tapOn: "Stats, tab.*"
- assertVisible: "2 to-dos"
- assertVisible: "1 done"
- assertVisible: "1 left"
- assertVisible: "50% done"
- tapOn: "To-dos, tab.*"
- tapOn: "Walk dog"
- tapOn: "Stats, tab.*"
- assertVisible: "100% done"
