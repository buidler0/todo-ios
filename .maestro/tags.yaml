# The non-ASCII tag checks that Hermes accepts the Unicode regex in lib/tags.ts, which Jest cannot.
appId: com.buidler0.todoios
---
- launchApp:
    clearState: true
# A no-op swipe stops Maestro's iOS driver crashing on a cold start.
- swipe:
    direction: DOWN
    duration: 100
- extendedWaitUntil:
    visible:
      text: "All"
      enabled: true
    timeout: 20000
- tapOn: "What needs doing?"
- inputText: "Buy milk #shop"
- tapOn: "Add"
- inputText: "Call mum #home"
- tapOn: "Add"
- inputText: "Bake bread #café"
- tapOn: "Add"
- assertVisible: "Buy milk #shop"
- assertVisible: "Call mum #home"
- assertVisible: "Bake bread #café"
- tapOn: "Tag #shop"
- assertVisible: "Buy milk #shop"
- assertNotVisible: "Call mum #home"
- tapOn: "Done"
- assertVisible: "No done to-dos tagged #shop."
- tapOn: "All"
- tapOn: "Tag #shop"
- assertVisible: "Buy milk #shop"
- assertVisible: "Call mum #home"
- assertVisible: "Bake bread #café"
- tapOn: "Tag #café"
- assertVisible: "Bake bread #café"
- assertNotVisible: "Buy milk #shop"
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      text: "All"
      enabled: true
    timeout: 20000
- assertVisible: "Buy milk #shop"
- assertVisible: "Call mum #home"
- assertVisible: "Bake bread #café"
