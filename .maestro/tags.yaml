# Narrows the list by a tag and back, and checks the tag is not kept across a relaunch.
# Run: maestro --device <simulator UDID> test .maestro/tags.yaml --test-output-dir <your own folder>
appId: com.buidler0.todoios
---
- launchApp:
    clearState: true
# A no-op swipe stops Maestro's iOS driver crashing on a cold start.
- swipe:
    direction: DOWN
    duration: 100
# The filter buttons stay disabled until the saved list has loaded.
- extendedWaitUntil:
    visible:
      text: "All"
      enabled: true
    timeout: 20000
- tapOn: "What needs doing?"
- inputText: "Buy milk #shop"
- tapOn: "Add"
- tapOn: "What needs doing?"
- inputText: "Walk dog"
- tapOn: "Add"
- assertVisible: "Tag #shop"
- tapOn: "Tag #shop"
- assertVisible: "Buy milk #shop"
- assertNotVisible: "Walk dog"
- tapOn: "Tag #shop"
- assertVisible: "Walk dog"
- tapOn: "What needs doing?"
- inputText: "Buy eggs #Shop."
- tapOn: "Add"
- tapOn: "Tag #shop"
- assertVisible: "Buy milk #shop"
- assertVisible: "Buy eggs #Shop."
- assertNotVisible: "Walk dog"
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      text: "All"
      enabled: true
    timeout: 20000
- assertVisible: "Buy milk #shop"
- assertVisible: "Walk dog"
- assertVisible: "Buy eggs #Shop."
