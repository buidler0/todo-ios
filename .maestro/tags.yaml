# Tags: a word starting with # is a tag; tag buttons filter the list and are not saved between launches.
# Run: maestro --device <simulator UDID> test .maestro/tags.yaml --test-output-dir <your own folder>
appId: com.buidler0.todoios
---
- launchApp:
    clearState: true
# A no-op swipe stops Maestro's iOS driver crashing on a cold start.
- swipe:
    direction: DOWN
    duration: 100
# The filter buttons stay disabled until the saved list has loaded.
- extendedWaitUntil:
    visible:
      text: "All"
      enabled: true
    timeout: 20000
- tapOn: "What needs doing?"
- inputText: "Buy milk #shop"
- tapOn: "Add"
- tapOn: "What needs doing?"
- inputText: "Call mum #family #shop"
- tapOn: "Add"
- tapOn: "What needs doing?"
- inputText: "Plain chore"
- tapOn: "Add"
- assertVisible: "Tag #shop"
- assertVisible: "Tag #family"
- assertNotVisible: "Tag #plain"
# Pressing a tag shows only its to-dos.
- tapOn: "Tag #family"
- assertVisible: "Call mum #family #shop"
- assertNotVisible: "Buy milk #shop"
- assertNotVisible: "Plain chore"
# Pressing it again clears it.
- tapOn: "Tag #family"
- assertVisible: "Buy milk #shop"
- assertVisible: "Plain chore"
# A tag narrows the Active and Done filters.
- tapOn: "Buy milk #shop"
- tapOn: "Tag #shop"
- assertVisible: "Buy milk #shop"
- assertVisible: "Call mum #family #shop"
- assertNotVisible: "Plain chore"
- tapOn: "Active"
- assertVisible: "Call mum #family #shop"
- assertNotVisible: "Buy milk #shop"
- tapOn: "Done"
- assertVisible: "Buy milk #shop"
- assertNotVisible: "Call mum #family #shop"
# The tag is not saved between launches (the All filter is, so go back to it first).
- tapOn: "All"
- assertNotVisible: "Plain chore"
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      text: "All"
      enabled: true
    timeout: 20000
- assertVisible: "Plain chore"
- assertVisible: "Tag #shop"
