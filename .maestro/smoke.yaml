# Adds a to-do, ticks it, and checks both survive a relaunch.
# Run: maestro --device <simulator UDID> test .maestro/smoke.yaml --test-output-dir <your own folder>
appId: com.buidler0.todoios
---
- launchApp:
    clearState: true
# A no-op swipe stops Maestro's iOS driver crashing on a cold start.
- swipe:
    direction: DOWN
    duration: 100
# The filter buttons stay disabled until the saved list has loaded.
- extendedWaitUntil:
    visible:
      text: "All"
      enabled: true
    timeout: 20000
- tapOn: "What needs doing?"
- inputText: "Buy milk"
- tapOn: "Add"
- assertVisible: "Buy milk"
- assertVisible: "1 item left"
- tapOn: "Buy milk"
- assertVisible: "0 items left"
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      text: "All"
      enabled: true
    timeout: 20000
- assertVisible: "Buy milk"
- assertVisible: "0 items left"
